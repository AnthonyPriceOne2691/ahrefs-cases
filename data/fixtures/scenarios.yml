# должен читаться глазами. Файл правится руками — значит и читается руками.
#
# Домена нет в таблице → `default`. Это нужно для показа сервиса на реальном
# списке заказчика до Ф7: неизвестный домен получает форму, а не пустоту.
#
# Смена `seed` переписывает ВСЕ серии, а на них стоят golden-тесты Ф3.
# Менять — отдельным решением, не заодно.

