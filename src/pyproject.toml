# Конфиг ТОЛЬКО для mutmut. Лежит в `src/`, а не в корне, потому что
# `scripts/lint/mutation_py.sh` запускает mutmut из корня импортов (cwd = каталог
# над пакетом), а mutmut 3.x читает конфиг из cwd. В корневом `pyproject.toml`
# эта секция стоять не может: оттуда её никто не прочитает.
#
# Ключ — `source_paths` (mutmut 3.x). Прежнее имя `paths_to_mutate` из 2.x гейт
# видит как отсутствие настройки и честно отказывается судить (Z20, 15.09.2026).
[tool.mutmut]
source_paths = ["ahrefs_cases"]
