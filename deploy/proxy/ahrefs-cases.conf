# Обратный прокси хоста для Ahrefs Cases на общем сервере.
#
# На машине несколько сервисов, и 80/443 держит один nginx хоста. У каждого
# сервиса — свой файл в sites-available и свой порт на петле; у этого —
# `127.0.0.1:8091` (`WEB_PORT` в `.env` сервера). Контейнер наружу не смотрит:
# опубликованный на 0.0.0.0 порт докер открыл бы мимо ufw, без TLS и без
# этого файла.
#
# Ставится так (подробно — docs/PROD.md):
#   sed 's/cases.ПРИМЕР.ru/<имя сайта>/' deploy/proxy/ahrefs-cases.conf \
#     > /etc/nginx/sites-available/ahrefs-cases
#   ln -s /etc/nginx/sites-available/ahrefs-cases /etc/nginx/sites-enabled/
#   htpasswd -c /etc/nginx/ahrefs-cases.htpasswd cases
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d <имя сайта> --redirect ...   # только своё имя!
#
# certbot сам допишет сюда `listen 443 ssl`, пути к сертификату и
# перенаправление с http. Продление — системный таймер пакета certbot.
#
# ⚠ Имя сайта — заглушка. Настоящее подставляется при выкатке и сюда не
# коммитится: репозиторий публичный, а имя вида `*.sslip.io` содержит IP.
#
# ⚠ Имена зоны и формата журнала — с префиксом `cases_`: файлы всех сайтов
# включаются в один блок http, и совпавшее с соседом имя уронило бы
# `nginx -t` для всей машины.

# Потолок частоты входа — на адрес клиента, до сервера. В самом сервисе
# счётчика попыток нет, так что перебор пароля держит только эта строка.
limit_req_zone $binary_remote_addr zone=cases_login:10m rate=10r/m;

# Журнал без строки запроса: в ней фильтры экранов, которым в журнале прокси
# не место. Путь без параметров, метод, код, время.
log_format cases_safe '$remote_addr [$time_local] "$request_method $uri" '
                      '$status $body_bytes_sent $request_time';

server {
    listen 80;
    server_name cases.ПРИМЕР.ru;

    # Выше потолка сервиса (2 МБ, `api/routers/intake.py`): иначе список
    # проектов отбивался бы здесь безымянным 413 вместо ответа сервиса.
    client_max_body_size 3m;
    access_log /var/log/nginx/ahrefs-cases.access.log cases_safe;

    # HSTS — здесь, а не в контейнере: TLS живёт на этом уровне. certbot
    # переносит блок в `listen 443`, по http браузер заголовок игнорирует.
    # Без includeSubDomains и preload: на машине соседи на других поддоменах.
    # ⚠ add_header наследуется в location, только пока у того нет своего
    # add_header. Заведёшь его в location ниже — повтори там и эту строку.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # ⚠ Адрес клиента ПЕРЕЗАПИСЫВАЕТСЯ, а не дописывается: при
    # `$proxy_add_x_forwarded_for` цепочку начинает то, что прислал сам
    # клиент. Здесь первый и единственный, кто видит настоящий адрес.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    # Столько же, сколько у nginx контейнера (`deploy/nginx.conf`): сборка
    # кейсов отвечает дольше умолчания в 60 секунд.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # Оболочка приложения — за паролем прокси: посторонний не видит даже
    # экрана входа. Схемы API снаружи нет вовсе — nginx контейнера пускает к
    # серверу только /api/, а `/docs` FastAPI живёт вне этого префикса.
    location / {
        auth_basic "Ahrefs Cases";
        auth_basic_user_file /etc/nginx/ahrefs-cases.htpasswd;
        proxy_pass http://127.0.0.1:8091;
    }

    # ⚠ На /api/ пароля прокси нет и быть не может: фронт шлёт свой пропуск
    # заголовком `Authorization: Bearer`, и basic auth на том же заголовке
    # отказал бы каждому запросу. API защищён входом сервиса.
    location /api/ {
        # ZIP с кейсами отдаётся потоком — как и в nginx контейнера.
        proxy_buffering off;
        proxy_pass http://127.0.0.1:8091;
    }

    location = /api/auth/login {
        limit_req zone=cases_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8091;
    }
}
