# Раздача собранного фронта и проксирование API.
#
# Зачем отдельный контейнер, а не раздача из FastAPI: раздача файлов и API в
# одном процессе смешивают роли, а TLS всё равно требует чего-то впереди — вот
# это «что-то» здесь и стоит. На сервере сюда добавятся сертификат и 443-й порт.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Сжатие включено для текстовых форматов: фронт — это JS и JSON, и без
    # сжатия первая загрузка тащит мегабайты по сети агентства.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Файлы сборки именуются с хешем содержимого, поэтому кэшируются навсегда:
    # изменился файл — изменилось имя.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Прогон запускается запросом и уходит в очередь, но ответа сборки
        # кейсов приходится ждать дольше умолчания nginx в 60 секунд.
        proxy_read_timeout 300s;
        # Скачивание ZIP идёт потоком: буферизация целиком съела бы память на
        # пачке в сотню PDF.
        proxy_buffering off;
    }

    # Маршрутизация живёт в браузере: адрес `/intake`, открытый напрямую или
    # обновлением страницы, обязан отдать приложение, а не 404 от nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
