# Раздача собранного фронта и проксирование API.
#
# Зачем отдельный контейнер, а не раздача из FastAPI: раздача файлов и API в
# одном процессе смешивают роли, а TLS всё равно требует чего-то впереди — вот
# это «что-то» здесь и стоит. На сервере сюда добавятся сертификат и 443-й порт.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Версия nginx в заголовке `Server` и на страницах ошибок никому снаружи
    # не нужна, а сканеру уязвимостей подсказывает, что пробовать.
    server_tokens off;

    # Общие заголовки безопасности (`deploy/security-headers.conf`, в образе —
    # /etc/nginx/snippets/). ⚠ Каждый location со своим add_header обязан
    # повторить этот include — иначе он теряет их молча.
    include /etc/nginx/snippets/security-headers.conf;

    # Потолок тела запроса — выше, чем у сервера (`MAX_UPLOAD_BYTES` = 2 МБ в
    # `api/routers/intake.py`), а не ниже. Умолчание nginx — 1 МБ: список на
    # полтора мегабайта отбивался бы здесь безымянной HTML-страницей 413, и
    # внятный ответ сервиса «файл больше 2 МБ» до человека не доходил бы.
    client_max_body_size 3m;

    # Сжатие включено для текстовых форматов: фронт — это JS и JSON, и без
    # сжатия первая загрузка тащит мегабайты по сети агентства.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Файлы сборки именуются с хешем содержимого, поэтому кэшируются навсегда:
    # изменился файл — изменилось имя.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Имя `api` разрешается через DNS докера по ходу работы, а не один раз при
    # старте nginx. Иначе nginx помнит адрес контейнера, с которым стартовал:
    # выкатка, пересоздавшая только api (образ web не менялся — компоуз web не
    # трогает), давала 502 на каждый запрос к API, пока web не перезапустят
    # руками. Разрешение по ходу включает именно переменная в proxy_pass; URI
    # в ней нет, поэтому путь запроса уходит к серверу как пришёл.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Прогон запускается запросом и уходит в очередь, но ответа сборки
        # кейсов приходится ждать дольше умолчания nginx в 60 секунд.
        proxy_read_timeout 300s;
        # Скачивание ZIP идёт потоком: буферизация целиком съела бы память на
        # пачке в сотню PDF.
        proxy_buffering off;
    }

    # Документ приложения сверяется при каждом открытии. Он ссылается на файлы
    # сборки по именам с хешем, а после выкатки прежних файлов в образе уже
    # нет: без заголовка браузер держит старый index.html по эвристике
    # Last-Modified и показывает белый экран до жёсткого обновления.
    # `no-cache` — не «не хранить», а «спроси, не изменился ли»: ETag
    # отвечает 304, трафика почти нет. Сюда приходят и `/`, и адреса экранов —
    # через внутренний переход `index` и `try_files` ниже.
    #
    # CSP — только на документ: у API ответы JSON, политика им не нужна. Скрипты
    # только свои: встроенных в index.html нет (`tests/test_deploy_headers.py`
    # сторожит: появится встроенный — нужен его sha256 здесь). `unsafe-inline`
    # у стилей — ради Mantine: он ставит <style> с переменными темы и
    # style-атрибуты. Графики карточки — встроенный SVG без <style>, файлы
    # кейсов скачиваются через blob:-ссылку, это навигация, и политика её не
    # трогает.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Маршрутизация живёт в браузере: адрес `/intake`, открытый напрямую или
    # обновлением страницы, обязан отдать приложение, а не 404 от nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
