# Раздача собранного фронта и проксирование API.
#
# Зачем отдельный контейнер, а не раздача из FastAPI: раздача файлов и API в
# одном процессе смешивают роли, а TLS всё равно требует чего-то впереди — вот
# это «что-то» здесь и стоит. На сервере сюда добавятся сертификат и 443-й порт.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Потолок тела запроса — выше, чем у сервера (`MAX_UPLOAD_BYTES` = 2 МБ в
    # `api/routers/intake.py`), а не ниже. Умолчание nginx — 1 МБ: список на
    # полтора мегабайта отбивался бы здесь безымянной HTML-страницей 413, и
    # внятный ответ сервиса «файл больше 2 МБ» до человека не доходил бы.
    client_max_body_size 3m;

    # Сжатие включено для текстовых форматов: фронт — это JS и JSON, и без
    # сжатия первая загрузка тащит мегабайты по сети агентства.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Файлы сборки именуются с хешем содержимого, поэтому кэшируются навсегда:
    # изменился файл — изменилось имя.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Прогон запускается запросом и уходит в очередь, но ответа сборки
        # кейсов приходится ждать дольше умолчания nginx в 60 секунд.
        proxy_read_timeout 300s;
        # Скачивание ZIP идёт потоком: буферизация целиком съела бы память на
        # пачке в сотню PDF.
        proxy_buffering off;
    }

    # Документ приложения сверяется при каждом открытии. Он ссылается на файлы
    # сборки по именам с хешем, а после выкатки прежних файлов в образе уже
    # нет: без заголовка браузер держит старый index.html по эвристике
    # Last-Modified и показывает белый экран до жёсткого обновления.
    # `no-cache` — не «не хранить», а «спроси, не изменился ли»: ETag
    # отвечает 304, трафика почти нет. Сюда приходят и `/`, и адреса экранов —
    # через внутренний переход `index` и `try_files` ниже.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # Маршрутизация живёт в браузере: адрес `/intake`, открытый напрямую или
    # обновлением страницы, обязан отдать приложение, а не 404 от nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
