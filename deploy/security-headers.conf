# Общие заголовки безопасности — отдельным сниппетом, а не строками в server {}.
#
# ⚠ add_header наследуется в location, ТОЛЬКО пока у того нет ни одного своего
# add_header. Любой location со своим (Cache-Control у /assets/, у документа)
# молча теряет все общие — поэтому сниппет повторяется include'ом в каждом
# таком location. Сторожит это tests/test_deploy_headers.py.
#
# `always` — чтобы заголовки стояли и на 4xx/5xx: страница ошибки такая же
# страница, и её точно так же можно встроить в чужой фрейм.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
# Адрес сервиса не уходит сайтам, которые открывают из интерфейса.
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
