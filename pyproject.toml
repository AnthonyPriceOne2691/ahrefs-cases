# Каркас. Зависимости объявлены под Ф1 и будут уточняться после спайка Ф0.
[project]
name = "ahrefs-cases"
version = "0.0.1"
description = "Автогенерация SEO-кейсов из динамики Ahrefs"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",        # thresholds.yml
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",    # Ф1; Postgres/asyncpg — Ф5
    "chardet>=5.0",       # defensive CSV (Excel в cp1251)
    "typer>=0.12",        # CLI Ф1-Ф3
]

[project.optional-dependencies]
export = ["jinja2>=3.1", "weasyprint>=62.0"]   # Ф3, после утверждения макета
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.6", "mypy>=1.11"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
